---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install basic utilities
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip
      - tar
      - git
      - fail2ban
    state: present

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true