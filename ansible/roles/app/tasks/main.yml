---
- name: Install Node.js prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Run NodeSource setup script
  ansible.builtin.command:
    cmd: /tmp/nodesource_setup.sh
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command:
    cmd: node --version
  register: node_version
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Verify npm installation
  ansible.builtin.command:
    cmd: npm --version
  register: npm_version
  changed_when: false

- name: Display npm version
  ansible.builtin.debug:
    msg: "npm version: {{ npm_version.stdout }}"

- name: Create application directory
  ansible.builtin.file:
    path: /opt/nodejs-service-deployment
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone application repository
  ansible.builtin.git:
    repo: "https://github.com/tommycontreras11/nodejs-service-deployment.git"
    dest: /opt/nodejs-service-deployment
    version: master
    force: true
  become_user: ubuntu
  notify: Restart Node.js application

- name: Install application dependencies
  ansible.builtin.command:
    cmd: npm install
    chdir: /opt/nodejs-service-deployment/app
  become_user: ubuntu

- name: Create systemd service for Node.js application
  ansible.builtin.copy:
    dest: /etc/systemd/system/nodejs-service.service
    mode: "0644"
    content: |
      [Unit]
      Description=Node.js Service
      After=network.target

      [Service]
      Type=simple
      User=ubuntu
      WorkingDirectory=/opt/nodejs-service-deployment/app
      ExecStart=/usr/bin/node src/index.js
      Restart=always
      RestartSec=5
      Environment=NODE_ENV=production

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Node.js application is enabled
  ansible.builtin.systemd:
    name: nodejs-service
    enabled: true
